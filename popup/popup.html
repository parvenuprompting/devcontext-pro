<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevContext Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="DevContext Pro" class="logo-icon">
        <h1>DevContext Pro</h1>
      </div>
      <div class="version">v1.3.0</div>
    </div>

    <!-- Main Actions -->
    <div class="actions">
      <button class="action-btn primary" id="scrapeComponent">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" />
          <path d="M9 9L15 15M15 9L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <span>Scrape Component</span>
        <kbd class="shortcut-hint">Alt+S</kbd>
      </button>

      <!-- Multi-Select Toggle -->
      <div class="toggle-row">
        <button class="action-btn secondary toggle-btn" id="multiSelectMode">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span>Multi-Select Mode</span>
          <kbd class="shortcut-hint">Alt+M</kbd>
        </button>
        <div class="toggle-switch" id="multiSelectToggle">
          <input type="checkbox" id="multiSelectCheck">
          <label for="multiSelectCheck"></label>
        </div>
      </div>

      <button class="action-btn secondary" id="cleanDOM">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Clean DOM</span>
      </button>

      <button class="action-btn secondary" id="copyAPI">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2" />
          <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="currentColor" stroke-width="2" />
        </svg>
        <span>Copy API State</span>
      </button>

      <!-- Diff Mode -->
      <div class="diff-mode-row">
        <button class="action-btn secondary" id="startDiff">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
            <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Start Diff</span>
        </button>
        <button class="action-btn secondary" id="captureDiff" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Copy Diff</span>
        </button>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <h3>Quick Actions</h3>
      <div class="quick-action-grid">
        <button class="quick-btn" id="genTSInterface" title="Generate TypeScript Interface">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M3 3h18v18H3V3z" stroke="currentColor" stroke-width="2"/>
            <text x="7" y="16" fill="currentColor" font-size="10" font-weight="bold">TS</text>
          </svg>
          <span>TS Interface</span>
        </button>
        <button class="quick-btn" id="copySelector" title="Copy CSS Selector">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M7 8l-4 4 4 4M17 8l4 4-4 4M14 4l-4 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>CSS Selector</span>
        </button>
        <button class="quick-btn" id="networkSnap" title="Network Activity Snapshot">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Network</span>
        </button>
        <button class="quick-btn" id="exportMarkdown" title="Export as Markdown Documentation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor" stroke-width="2"/>
            <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Markdown</span>
        </button>
      </div>
    </div>

    <!-- Ask AI Section -->
    <div class="ask-ai-section">
      <h3>Ask AI</h3>
      <div class="ai-provider-select">
        <label class="radio-label">
          <input type="radio" name="aiProvider" value="gemini" checked>
          <span class="radio-custom"></span>
          <span>Gemini</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="aiProvider" value="chatgpt">
          <span class="radio-custom"></span>
          <span>ChatGPT</span>
        </label>
      </div>
      <button class="action-btn ai-btn" id="askAI">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Open in AI</span>
      </button>
    </div>

    <!-- Settings -->
    <div class="settings">
      <h3>Preferences</h3>
      
      <div class="settings-group">
        <div class="setting-item">
          <label>
            <input type="checkbox" id="assetPlaceholders" checked>
            <span>Asset Placeholders</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="preserveAriaData" checked>
            <span>Preserve Aria/Data Attrs</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="excludeComments" checked>
            <span>Exclude Comments</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="autoFormat" checked>
            <span>Auto-format for Gemini</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="removeScripts" checked>
            <span>Remove Scripts & Styles</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="smartTrimTailwind" checked>
            <span>Smart Trim Tailwind</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="includeTailwindConfig">
            <span>Include Tailwind Config</span>
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="inferComponentNames" checked>
            <span>Infer Component Names</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Custom Prompts Library -->
    <div class="custom-prompts">
      <div class="prompts-header">
        <h3>Custom Prompts</h3>
        <button class="add-prompt-btn" id="addPrompt">+ Add</button>
      </div>
      <div class="prompts-list" id="promptsList">
        <!-- Prompts will be loaded here -->
      </div>
      
      <!-- Add Prompt Modal -->
      <div class="prompt-modal" id="promptModal">
        <div class="prompt-modal-content">
          <h4>Add Custom Prompt</h4>
          <input type="text" id="promptName" placeholder="Prompt name..." maxlength="50">
          <textarea id="promptText" placeholder="Enter your prompt template..." rows="4"></textarea>
          <div class="modal-actions">
            <button class="modal-btn cancel" id="cancelPrompt">Cancel</button>
            <button class="modal-btn save" id="savePrompt">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div class="status" id="status">
      <div class="status-indicator"></div>
      <span>Ready</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
